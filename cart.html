<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Rapid Volt</title>

<link rel="shortcut icon" type="image/png"
      href="assets/images/rapidvolt.png">

<link rel="stylesheet"
      href="https://cloudflare.com">

<link rel="stylesheet"
      href="assets/css/bootstrap.min.css">

<link rel="stylesheet"
      href="assets/css/style.css">
</head>

<body>

<!-- ================= HEADER ================= -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

  <div class="container">

    <a class="navbar-brand font-weight-bold" href="#">
      Rapid Volt
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-toggle="collapse"
      data-target="#navMain">

      <span class="navbar-toggler-icon"></span>

    </button>

    <div class="collapse navbar-collapse" id="navMain">

      <ul class="navbar-nav ml-auto">

        <li class="nav-item">
          <a class="nav-link" href="index.html">
            Home
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">
            Shop
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="article.html">
            About Us
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link text-success font-weight-bold"
            href="https://wa.me"
            target="_blank">

            <i class="fab fa-whatsapp"></i>
            WhatsApp

          </a>
        </li>

      </ul>

    </div>

  </div>

</nav>


<!-- ================= SHOP ================= -->

<section class="container my-5">

  <h2 class="text-center mb-4">
    Rapid Volt – Cabling Products
  </h2>


  <!-- SEARCH -->

  <div class="row mb-4">

    <div class="col-md-6 mx-auto">

      <input
        type="text"
        id="search"
        class="form-control form-control-lg"
        placeholder="Search products...">

    </div>

  </div>


  <!-- PRODUCT LIST -->

  <div class="row" id="product-list"></div>


  <hr class="my-5">


  <!-- ================= CART ================= -->

  <div class="row">

    <div class="col-md-8 mx-auto bg-light p-4 rounded shadow-sm">

      <h4 class="mb-3">

        <i class="fas fa-shopping-cart"></i>
        Your Cart

      </h4>


      <ul
        id="cart-items"
        class="list-group mb-3">
      </ul>


      <!-- DELIVERY LOCATION -->

      <div class="form-group mb-3">

        <label
          for="location"
          class="font-weight-bold text-muted small">

          Delivery Address / Location:

        </label>

        <textarea
          id="location"
          class="form-control"
          rows="2"
          placeholder="Type your delivery location or warehouse address here...">
        </textarea>

      </div>


      <!-- CUSTOMER NAME -->

      <div class="form-group mb-3">

        <label
          for="customer-name"
          class="font-weight-bold text-muted small">

          Your Name:

        </label>

        <input
          type="text"
          id="customer-name"
          class="form-control"
          placeholder="Enter your name">

      </div>


      <!-- CUSTOMER PHONE -->

      <div class="form-group mb-3">

        <label
          for="customer-phone"
          class="font-weight-bold text-muted small">

          Phone Number:

        </label>

        <input
          type="tel"
          id="customer-phone"
          class="form-control"
          placeholder="Enter your phone number">

      </div>


      <!-- CUSTOMER EMAIL -->

      <div class="form-group mb-3">

        <label
          for="customer-email"
          class="font-weight-bold text-muted small">

          Email:

        </label>

        <input
          type="email"
          id="customer-email"
          class="form-control"
          placeholder="Enter your email">

      </div>


      <!-- TOTAL -->

      <div class="d-flex justify-content-between align-items-center mb-3">

        <h5 class="m-0">
          Total:
        </h5>

        <h4 class="m-0 text-primary">

          AED
          <span id="total">0</span>

        </h4>

      </div>


      <!-- SEND ORDER -->

      <div class="row">

        <div class="col-12">

          <button
            type="button"
            id="send-order-button"
            class="btn btn-primary btn-lg w-100"
            disabled>

            <i class="fas fa-paper-plane"></i>
            Send Order

          </button>

        </div>

      </div>


      <!-- ORDER MESSAGE -->

      <div
        id="order-message"
        class="text-center mt-3">
      </div>

    </div>

  </div>

</section>


<!-- ================= FOOTER ================= -->

<footer class="bg-dark text-white text-center p-3 mt-5">

  © 2026 Rapid Volt

</footer>


<!-- ================= JAVASCRIPT ================= -->

<script src="assets/js/jquery-1.12.0.min.js"></script>
<script src="assets/js/bootstrap.min.js"></script>


<script>

/* =====================================================
   CART
===================================================== */

let cart = [];
let total = 0;


/* =====================================================
   CLOUDFLARE WORKER
===================================================== */

const ORDER_SERVER_URL =
"https://shrill-leaf-26ee.ridwaanali147.workers.dev/orders";


/* =====================================================
   SEARCH
===================================================== */

document
  .getElementById("search")
  .addEventListener("input", filterProducts);


function filterProducts() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const cards =
    document.querySelectorAll(
      "#product-list .product-card"
    );

  cards.forEach(function(card) {

    const name =
      card
        .querySelector(".product-name")
        .textContent
        .toLowerCase();

    card.style.display =
      name.includes(search)
        ? ""
        : "none";

  });

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

fetch("products.txt")

.then(function(response) {

  if (!response.ok) {
    throw new Error(
      "Could not load products.txt"
    );
  }

  return response.text();

})

.then(function(text) {

  const container =
    document.getElementById(
      "product-list"
    );

  const lines =
    text.split(/\r?\n/);

  let category = "";


  lines.forEach(function(line) {

    line = line.trim();

    if (!line) {
      return;
    }


    /* CATEGORY */

    if (line.startsWith("#")) {

      category =
        line
          .substring(1)
          .trim();

      const categoryDiv =
        document.createElement("div");

      categoryDiv.className =
        "col-12 mt-4 mb-2";

      categoryDiv.innerHTML = `
        <h3 class="border-bottom pb-2">
          ${escapeHTML(category)}
        </h3>
      `;

      container.appendChild(
        categoryDiv
      );

      return;
    }


    /* PRODUCT */

    const parts =
      line.split("|");

    const name =
      parts[0].trim();

    let price = 0;

    if (parts.length > 1) {

      const parsed =
        parseFloat(
          parts[1].trim()
        );

      if (!isNaN(parsed)) {
        price = parsed;
      }

    }


    /* PRODUCT CARD */

    const card =
      document.createElement("div");

    card.className =
      "col-md-4 mb-4 product-card";


    card.innerHTML = `

      <div class="card h-100 p-3 shadow-sm">

        <h4 class="product-name">
          ${escapeHTML(name)}
        </h4>

        <small
          class="badge badge-secondary align-self-start mb-2">

          ${escapeHTML(category)}

        </small>

        <p class="h5 text-primary mt-auto">

          ${
            price > 0
              ? "AED " + price.toFixed(2)
              : "Price on Request"
          }

        </p>

        <div class="form-group mb-2">

          <label class="small text-muted mb-1">
            Quantity:
          </label>

          <input
            type="number"
            value="1"
            min="1"
            step="1"
            class="form-control product-quantity">

        </div>

        <button
          type="button"
          class="btn btn-primary w-100 add-cart-button">

          <i class="fas fa-plus"></i>
          Add to Cart

        </button>

      </div>

    `;


    /* =================================================
       ADD BUTTON
    ================================================= */

    const addButton =
      card.querySelector(
        ".add-cart-button"
      );


    const quantityInput =
      card.querySelector(
        ".product-quantity"
      );


    addButton.onclick =
      function(event) {

        event.preventDefault();
        event.stopPropagation();

        let quantity =
          parseInt(
            quantityInput.value,
            10
          );

        if (
          isNaN(quantity) ||
          quantity < 1
        ) {

          quantity = 1;

          quantityInput.value = 1;

        }


        addToCart(
          name,
          price,
          quantity
        );

      };


    /* ADD CARD */

    container.appendChild(card);

  });

})


.catch(function(error) {

  console.error(error);

  document.getElementById(
    "product-list"
  ).innerHTML = `

    <div class="col-12">

      <div class="alert alert-danger">

        Could not load products.txt.

        <br><br>

        Make sure products.txt is
        in the same folder as cart.html.

      </div>

    </div>

  `;

});


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(
  name,
  price,
  quantity
) {

  quantity =
    parseInt(
      quantity,
      10
    );


  if (
    isNaN(quantity) ||
    quantity < 1
  ) {

    quantity = 1;

  }


  const existing =
    cart.find(function(item) {

      return item.name === name;

    });


  if (existing) {

    existing.qty += quantity;

    existing.price +=
      price * quantity;

  }

  else {

    cart.push({

      name: name,

      qty: quantity,

      price:
        price * quantity

    });

  }


  updateCart();


  const message =
    document.getElementById(
      "order-message"
    );


  message.innerHTML = `

    <div class="alert alert-success">

      ✓ ${escapeHTML(name)} added to cart

    </div>

  `;


  setTimeout(function() {

    message.innerHTML = "";

  }, 1500);

}


/* =====================================================
   REMOVE
===================================================== */

function removeFromCart(index) {

  if (
    index < 0 ||
    index >= cart.length
  ) {

    return;

  }


  cart.splice(
    index,
    1
  );


  updateCart();

}


/* =====================================================
   UPDATE CART
===================================================== */

function updateCart() {

  const list =
    document.getElementById(
      "cart-items"
    );


  const sendButton =
    document.getElementById(
      "send-order-button"
    );


  list.innerHTML = "";

  total = 0;


  if (cart.length === 0) {

    list.innerHTML = `

      <li
        class="list-group-item text-muted text-center py-3">

        Your cart is completely empty

      </li>

    `;


    sendButton.disabled = true;


    document.getElementById(
      "total"
    ).textContent = "0.00";


    return;

  }


  cart.forEach(function(item, index) {

    total += item.price;


    const li =
      document.createElement("li");


    li.className =
      "list-group-item d-flex justify-content-between align-items-center";


    li.innerHTML = `

      <div>

        <strong>
          ${escapeHTML(item.name)}
        </strong>

        <span
          class="badge badge-pill badge-primary ml-2">

          x${item.qty}

        </span>

        <div class="small text-muted">

          AED ${item.price.toFixed(2)}

        </div>

      </div>

      <button
        type="button"
        class="btn btn-danger btn-sm remove-cart-button">

        <i class="fas fa-trash"></i>
        Remove

      </button>

    `;


    li
      .querySelector(
        ".remove-cart-button"
      )
      .onclick =
      function() {

        removeFromCart(index);

      };


    list.appendChild(li);

  });


  document.getElementById(
    "total"
  ).textContent =
    total.toFixed(2);


  sendButton.disabled = false;

}


/* =====================================================
   SEND ORDER
===================================================== */

document
  .getElementById(
    "send-order-button"
  )
  .addEventListener(
    "click",
    sendOrder
  );


async function sendOrder() {

  if (cart.length === 0) {

    alert(
      "Your cart is empty."
    );

    return;

  }


  const customerName =
    document
      .getElementById(
        "customer-name"
      )
      .value
      .trim();


  const customerPhone =
    document
      .getElementById(
        "customer-phone"
      )
      .value
      .trim();


  const customerEmail =
    document
      .getElementById(
        "customer-email"
      )
      .value
      .trim();


  const location =
    document
      .getElementById(
        "location"
      )
      .value
      .trim();


  if (!customerName) {

    alert(
      "Please enter your name."
    );

    return;

  }


  if (!customerPhone) {

    alert(
      "Please enter your phone number."
    );

    return;

  }


  if (!location) {

    alert(
      "Please enter your delivery location."
    );

    return;

  }


  const order = {

    orderId:
      "RV-" + Date.now(),

    customerName:
      customerName,

    customerPhone:
      customerPhone,

    customerEmail:
      customerEmail,

    deliveryLocation:
      location,

    items:
      cart.map(function(item) {

        return {

          name:
            item.name,

          quantity:
            item.qty,

          unitPrice:
            item.qty > 0
              ? Number(
                  (
                    item.price /
                    item.qty
                  ).toFixed(2)
                )
              : 0

        };

      }),

    total:
      Number(
        total.toFixed(2)
      ),

    createdAt:
      new Date().toISOString()

  };


  const button =
    document.getElementById(
      "send-order-button"
    );


  const message =
    document.getElementById(
      "order-message"
    );


  button.disabled = true;


  button.innerHTML =
    '<i class="fas fa-spinner fa-spin"></i> Sending...';


  message.innerHTML = "";


  try {

    const response =
      await fetch(
        ORDER_SERVER_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify(order)

        }
      );


    if (!response.ok) {

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    message.innerHTML = `

      <div class="alert alert-success">

        <strong>
          ✓ Order sent successfully!
        </strong>

        <br>

        Order number:
        ${escapeHTML(order.orderId)}

      </div>

    `;


    cart = [];

    updateCart();


    document.getElementById(
      "customer-name"
    ).value = "";


    document.getElementById(
      "customer-phone"
    ).value = "";


    document.getElementById(
      "customer-email"
    ).value = "";


    document.getElementById(
      "location"
    ).value = "";

  }

  catch(error) {

    console.error(
      "Order error:",
      error
    );


    message.innerHTML = `

      <div class="alert alert-danger">

        <strong>
          ✕ Order could not be sent.
        </strong>

        <br>

        Please try again.

      </div>

    `;

  }


  button.disabled = false;


  button.innerHTML =
    '<i class="fas fa-paper-plane"></i> Send Order';

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

  return String(value || "")

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* =====================================================
   START
===================================================== */

updateCart();

  function goToCart() {
  const cart = document.getElementById("cart-items");

  if (cart) {
    cart.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }
}

</script>
  <!-- GO TO CART BUTTON -->
<button
  type="button"
  id="go-cart-button"
  onclick="goToCart()"
  title="Go to Cart">

  🛒

</button>

</body>
</html>
