<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Rapid Volt</title>
<link rel="shortcut icon" type="image/png" href="assets/images/rapidvolt.png">

<!-- FontAwesome -->
<link rel="stylesheet" href="https://cloudflare.com">
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<!-- ================= HEADER ================= -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

  <div class="container">

    <a class="navbar-brand font-weight-bold" href="#">
      Rapid Volt
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-toggle="collapse"
      data-target="#navMain">

      <span class="navbar-toggler-icon"></span>

    </button>

    <div
      class="collapse navbar-collapse"
      id="navMain">

      <ul class="navbar-nav ml-auto">

        <li class="nav-item">
          <a class="nav-link" href="index.html">
            Home
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">
            Shop
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="article.html">
            About Us
          </a>
        </li>

        <li class="nav-item">

          <a
            class="nav-link text-success font-weight-bold"
            href="https://wa.me"
            target="_blank">

            <i class="fab fa-whatsapp"></i>
            WhatsApp

          </a>

        </li>

      </ul>

    </div>

  </div>

</nav>


<!-- ================= SHOP SECTION ================= -->

<section class="container my-5">

  <h2 class="text-center mb-4">
    Rapid Volt – Cabling Products
  </h2>


  <!-- SEARCH -->

  <div class="row mb-4">

    <div class="col-md-6 mx-auto">

      <input
        type="text"
        id="search"
        class="form-control form-control-lg"
        placeholder="Search products..."
        onkeyup="filterProducts()">

    </div>

  </div>


  <!-- PRODUCTS -->

  <div
    class="row"
    id="product-list">

  </div>


  <hr class="my-5">


  <!-- ================= CART ================= -->

  <div class="row">

    <div
      class="col-md-8 mx-auto bg-light p-4 rounded shadow-sm">

      <h4 class="mb-3">

        <i class="fas fa-shopping-cart"></i>

        Your Cart

      </h4>


      <ul
        id="cart-items"
        class="list-group mb-3">

      </ul>


      <!-- LOCATION -->

      <div class="form-group mb-3">

        <label
          for="location"
          class="font-weight-bold text-muted small">

          Delivery Address / Location:

        </label>

        <textarea
          id="location"
          class="form-control"
          rows="2"
          placeholder="Type your delivery location or warehouse address here..."
          onkeyup="updateCart()"></textarea>

      </div>


      <!-- NAME -->

      <div class="form-group mb-3">

        <label
          for="customer-name"
          class="font-weight-bold text-muted small">

          Your Name:

        </label>

        <input
          type="text"
          id="customer-name"
          class="form-control"
          placeholder="Enter your name">

      </div>


      <!-- PHONE -->

      <div class="form-group mb-3">

        <label
          for="customer-phone"
          class="font-weight-bold text-muted small">

          Phone Number:

        </label>

        <input
          type="tel"
          id="customer-phone"
          class="form-control"
          placeholder="Enter your phone number">

      </div>


      <!-- EMAIL -->

      <div class="form-group mb-3">

        <label
          for="customer-email"
          class="font-weight-bold text-muted small">

          Email:

        </label>

        <input
          type="email"
          id="customer-email"
          class="form-control"
          placeholder="Enter your email">

      </div>


      <!-- TOTAL -->

      <div
        class="d-flex justify-content-between align-items-center mb-3">

        <h5 class="m-0">
          Total:
        </h5>

        <h4 class="m-0 text-primary">

          AED
          <span id="total">0</span>

        </h4>

      </div>


      <!-- SEND ORDER -->

      <div class="row">

        <div class="col-12">

          <button
            id="send-order-button"
            class="btn btn-primary btn-lg w-100"
            onclick="sendOrder()"
            disabled>

            <i class="fas fa-paper-plane"></i>

            Send Order

          </button>

        </div>

      </div>


      <!-- MESSAGE -->

      <div
        id="order-message"
        class="text-center mt-3">

      </div>

    </div>

  </div>

</section>


<!-- ================= FOOTER ================= -->

<footer
  class="bg-dark text-white text-center p-3 mt-5">

  © 2026 Rapid Volt

</footer>


<!-- JAVASCRIPT -->

<script src="assets/js/jquery-1.12.0.min.js"></script>
<script src="assets/js/bootstrap.min.js"></script>


<script>

/* =====================================================
   CART
===================================================== */

let cart = [];
let total = 0;


/* =====================================================
   YOUR CLOUDFLARE ORDER SERVER
===================================================== */

const ORDER_SERVER_URL =
"https://shrill-leaf-26ee.ridwaanali147.workers.dev/orders";


/* =====================================================
   SEARCH
===================================================== */

function filterProducts() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase();


  const cards =
    document.querySelectorAll(
      "#product-list .product-card"
    );


  cards.forEach(function(card) {

    const name =
      card
        .querySelector("h4")
        .textContent
        .toLowerCase();


    if (
      name.includes(search)
    ) {

      card.style.display = "";

    } else {

      card.style.display = "none";

    }

  });

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

fetch("products.txt")

.then(function(response) {

  if (!response.ok) {

    throw new Error(
      "products.txt could not be loaded"
    );

  }

  return response.text();

})

.then(function(text) {

  const lines =
    text.split(/\r?\n/);


  const container =
    document.getElementById(
      "product-list"
    );


  let category = "";
  let index = 0;


  lines.forEach(function(line) {

    line = line.trim();


    if (!line) {
      return;
    }


    /* CATEGORY */

    if (
      line.startsWith("#")
    ) {

      category =
        line
          .substring(1)
          .trim();


      container.innerHTML += `

        <div class="col-12 mt-4 mb-2">

          <h3 class="border-bottom pb-2">

            ${escapeHTML(category)}

          </h3>

        </div>

      `;

      return;

    }


    /* PRODUCT */

    const parts =
      line.split("|");


    const name =
      parts[0].trim();


    let price = 0;


    if (
      parts.length >= 2
    ) {

      price =
        parseFloat(
          parts[1].trim()
        );

    }


    const productCard =
      document.createElement(
        "div"
      );


    productCard.className =
      "col-md-4 mb-4 product-card";


    productCard.innerHTML = `

      <div class="card h-100 p-3 shadow-sm">

        <h4>
          ${escapeHTML(name)}
        </h4>

        <small
          class="badge badge-secondary align-self-start mb-2">

          ${escapeHTML(category)}

        </small>

        <p class="h5 text-primary mt-auto">

          ${
            price > 0
              ? "AED " + price
              : "Price on Request"
          }

        </p>

        <div class="form-group mb-2">

          <label class="small text-muted mb-1">

            Quantity:

          </label>

          <input
            type="number"
            value="1"
            min="1"
            class="form-control product-qty">

        </div>

        <button
          class="btn btn-primary w-100 add-button">

          <i class="fas fa-plus"></i>

          Add to Cart

        </button>

      </div>

    `;


    const quantity =
      productCard.querySelector(
        ".product-qty"
      );


    const addButton =
      productCard.querySelector(
        ".add-button"
      );


    addButton.addEventListener(
      "click",
      function() {

        addToCart(
          name,
          price,
          quantity.value
        );

      }
    );


    container.appendChild(
      productCard
    );


    index++;

  });

})

.catch(function(error) {

  console.error(error);


  document.getElementById(
    "product-list"
  ).innerHTML = `

    <div class="col-12">

      <div class="alert alert-danger">

        Could not load products.txt.

      </div>

    </div>

  `;

});


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(
  name,
  price,
  quantity
) {

  quantity =
    parseInt(quantity);


  if (
    isNaN(quantity) ||
    quantity < 1
  ) {

    alert(
      "Please enter a valid quantity."
    );

    return;

  }


  const existing =
    cart.find(function(item) {

      return item.name === name;

    });


  if (existing) {

    existing.qty +=
      quantity;


    existing.price +=
      price * quantity;

  }

  else {

    cart.push({

      name: name,

      qty: quantity,

      price:
        price * quantity

    });

  }


  updateCart();


  const message =
    document.getElementById(
      "order-message"
    );


  message.innerHTML = `

    <div class="alert alert-success">

      ✓ Added to cart

    </div>

  `;


  setTimeout(function() {

    message.innerHTML = "";

  }, 1500);

}


/* =====================================================
   REMOVE
===================================================== */

function removeFromCart(index) {

  cart.splice(
    index,
    1
  );


  updateCart();

}


/* =====================================================
   UPDATE CART
===================================================== */

function updateCart() {

  const list =
    document.getElementById(
      "cart-items"
    );


  const sendButton =
    document.getElementById(
      "send-order-button"
    );


  list.innerHTML = "";

  total = 0;


  if (
    cart.length === 0
  ) {

    list.innerHTML = `

      <li
        class="list-group-item text-muted text-center py-3">

        Your cart is completely empty

      </li>

    `;


    sendButton.disabled =
      true;


    document.getElementById(
      "total"
    ).textContent = "0";


    return;

  }


  sendButton.disabled =
    false;


  cart.forEach(function(
    item,
    index
  ) {

    total +=
      item.price;


    list.innerHTML += `

      <li
        class="list-group-item d-flex justify-content-between align-items-center">

        <div>

          <strong>

            ${escapeHTML(item.name)}

          </strong>


          <span
            class="badge badge-pill badge-primary ml-2">

            x${item.qty}

          </span>


          <div class="small text-muted">

            AED
            ${item.price.toFixed(2)}

          </div>

        </div>


        <button
          class="btn btn-danger btn-sm"
          onclick="removeFromCart(${index})">

          <i class="fas fa-trash"></i>

          Remove

        </button>

      </li>

    `;

  });


  document.getElementById(
    "total"
  ).textContent =
    total.toFixed(2);

}


/* =====================================================
   SEND ORDER TO CLOUDFLARE
===================================================== */

async function sendOrder() {

  if (
    cart.length === 0
  ) {

    alert(
      "Your cart is empty."
    );

    return;

  }


  const customerName =
    document
      .getElementById(
        "customer-name"
      )
      .value
      .trim();


  const customerPhone =
    document
      .getElementById(
        "customer-phone"
      )
      .value
      .trim();


  const customerEmail =
    document
      .getElementById(
        "customer-email"
      )
      .value
      .trim();


  const location =
    document
      .getElementById(
        "location"
      )
      .value
      .trim();


  if (!customerName) {

    alert(
      "Please enter your name."
    );

    return;

  }


  if (!customerPhone) {

    alert(
      "Please enter your phone number."
    );

    return;

  }


  if (!location) {

    alert(
      "Please enter your delivery location."
    );

    return;

  }


  const order = {

    orderId:
      "RV-" + Date.now(),

    customerName:
      customerName,

    customerPhone:
      customerPhone,

    customerEmail:
      customerEmail,

    deliveryLocation:
      location,

    items:
      cart.map(function(item) {

        return {

          name:
            item.name,

          quantity:
            item.qty,

          unitPrice:
            item.qty > 0
              ? item.price / item.qty
              : 0

        };

      }),

    total:
      Number(
        total.toFixed(2)
      ),

    createdAt:
      new Date().toISOString()

  };


  const button =
    document.getElementById(
      "send-order-button"
    );


  const message =
    document.getElementById(
      "order-message"
    );


  button.disabled =
    true;


  button.innerHTML =
    '<i class="fas fa-spinner fa-spin"></i> Sending...';


  try {

    const response =
      await fetch(
        ORDER_SERVER_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify(order)

        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "Server error"
      );

    }


    message.innerHTML = `

      <div class="alert alert-success">

        <strong>
          ✓ Order sent successfully!
        </strong>

        <br>

        Order number:
        ${escapeHTML(order.orderId)}

      </div>

    `;


    /* CLEAR CART */

    cart = [];

    updateCart();


    /* CLEAR CUSTOMER DATA */

    document.getElementById(
      "customer-name"
    ).value = "";


    document.getElementById(
      "customer-phone"
    ).value = "";


    document.getElementById(
      "customer-email"
    ).value = "";


    document.getElementById(
      "location"
    ).value = "";

  }

  catch(error) {

    console.error(error);


    message.innerHTML = `

      <div class="alert alert-danger">

        <strong>
          ✕ Order could not be sent.
        </strong>

        <br>

        Please try again.

      </div>

    `;

  }


  button.disabled =
    false;


  button.innerHTML =
    '<i class="fas fa-paper-plane"></i> Send Order';

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

  return String(
    value || ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   START CART
===================================================== */

updateCart();

</script>

</body>
</html>
