<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Rapid Volt</title>
<link rel="shortcut icon" type="image/png" href="assets/images/rapidvolt.png">

<!-- FontAwesome CDN for icons -->
<link rel="stylesheet" href="https://cloudflare.com">
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<!-- ================= HEADER ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand font-weight-bold" href="#">Rapid Volt</a>

    <button
      class="navbar-toggler"
      type="button"
      data-toggle="collapse"
      data-target="#navMain">

      <span class="navbar-toggler-icon"></span>

    </button>

    <div class="collapse navbar-collapse" id="navMain">

      <ul class="navbar-nav ml-auto">

        <li class="nav-item">
          <a class="nav-link" href="index.html">
            Home
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">
            Shop
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="article.html">
            About Us
          </a>
        </li>

        <li class="nav-item">

          <a
            class="nav-link text-success font-weight-bold"
            href="https://wa.me"
            target="_blank">

            <i class="fab fa-whatsapp"></i>
            WhatsApp

          </a>

        </li>

      </ul>

    </div>

  </div>
</nav>


<!-- ================= SHOP SECTION ================= -->

<section class="container my-5">

  <h2 class="text-center mb-4">
    Rapid Volt – Cabling Products
  </h2>


  <!-- Search Bar Row -->

  <div class="row mb-4">

    <div class="col-md-6 mx-auto">

      <input
        type="text"
        id="search"
        class="form-control form-control-lg"
        placeholder="Search products..."
        onkeyup="filterProducts()"
      >

    </div>

  </div>


  <!-- Dynamic Product List Container -->

  <div
    class="row"
    id="product-list">
  </div>


  <hr class="my-5">


  <!-- ================= CART SECTION ================= -->

  <div class="row">

    <div class="col-md-8 mx-auto bg-light p-4 rounded shadow-sm">

      <h4 class="mb-3">

        <i class="fas fa-shopping-cart"></i>

        Your Cart

      </h4>


      <ul
        id="cart-items"
        class="list-group mb-3">

        <!-- Cart items render here -->

      </ul>


      <!-- DELIVERY LOCATION INPUT FIELD -->

      <div class="form-group mb-3">

        <label
          for="location"
          class="font-weight-bold text-muted small">

          Delivery Address / Location:

        </label>


        <textarea
          id="location"
          class="form-control"
          rows="2"
          placeholder="Type your delivery location or warehouse address here..."
          onkeyup="updateCart()"
        ></textarea>

      </div>


      <!-- CUSTOMER NAME -->

      <div class="form-group mb-3">

        <label
          for="customer-name"
          class="font-weight-bold text-muted small">

          Your Name:

        </label>


        <input
          type="text"
          id="customer-name"
          class="form-control"
          placeholder="Enter your name"
        >

      </div>


      <!-- CUSTOMER PHONE -->

      <div class="form-group mb-3">

        <label
          for="customer-phone"
          class="font-weight-bold text-muted small">

          Phone Number:

        </label>


        <input
          type="tel"
          id="customer-phone"
          class="form-control"
          placeholder="Enter your phone number"
        >

      </div>


      <!-- CUSTOMER EMAIL -->

      <div class="form-group mb-3">

        <label
          for="customer-email"
          class="font-weight-bold text-muted small">

          Email:

        </label>


        <input
          type="email"
          id="customer-email"
          class="form-control"
          placeholder="Enter your email"
        >

      </div>


      <!-- TOTAL -->

      <div
        class="d-flex justify-content-between align-items-center mb-3">

        <h5 class="m-0">
          Total:
        </h5>

        <h4 class="m-0 text-primary">

          AED
          <span id="total">0</span>

        </h4>

      </div>


      <!-- ================= SEND ORDER ================= -->

      <div class="row">

        <div class="col-12">

          <button
            id="send-order-button"
            class="btn btn-primary btn-lg w-100"
            onclick="sendOrder()"
            disabled>

            <i class="fas fa-paper-plane"></i>

            Send Order

          </button>

        </div>

      </div>


      <!-- ORDER MESSAGE -->

      <div
        id="order-message"
        class="text-center mt-3">
      </div>


    </div>

  </div>

</section>


<!-- ================= FOOTER ================= -->

<footer
  class="bg-dark text-white text-center p-3 mt-5">

  © 2026 Rapid Volt

</footer>


<!-- JavaScript Assets -->

<script src="assets/js/jquery-1.12.0.min.js"></script>
<script src="assets/js/bootstrap.min.js"></script>


<script>

/* =====================================================
   CART
===================================================== */

let cart = [];

let total = 0;


/* =====================================================
   ORDER SERVER
===================================================== */

/*
 IMPORTANT:

 Replace this with the URL of your order server.

 Example:

 https://your-order-server.example/orders

 DO NOT put your APK's local IP here.

 The website needs a public HTTPS endpoint.
*/

const ORDER_SERVER_URL =
    "YOUR_ORDER_SERVER_URL";


/* =====================================================
   FILTER PRODUCTS
===================================================== */

function filterProducts() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase();


  const cards =
    document.querySelectorAll(
      "#product-list .product-card"
    );


  cards.forEach(card => {

    const name =
      card
        .querySelector("h4")
        .textContent
        .toLowerCase();


    card.style.display =
      name.includes(search)
        ? "block"
        : "none";

  });

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

fetch("products.txt")

  .then(res => res.text())

  .then(text => {

    const lines =
      text.split(/\r?\n/);


    const container =
      document.getElementById(
        "product-list"
      );


    let category = "";

    let index = 0;


    lines.forEach(line => {

      line = line.trim();


      if (!line)
        return;


      /* CATEGORY */

      if (
        line.startsWith("#")
      ) {

        category =
          line
            .replace("#", "")
            .trim();


        container.innerHTML += `

          <div class="col-12 mt-4 mb-2">

            <h3 class="border-bottom pb-2">

              ${escapeHTML(category)}

            </h3>

          </div>

        `;

        return;

      }


      /* PRODUCT */

      const parts =
        line.split("|");


      const name =
        parts[0].trim();


      const price =
        parts.length >= 2
          ? parseFloat(
              parts[1].trim()
            )
          : 0;


      container.innerHTML += `

        <div class="col-md-4 mb-4 product-card">

          <div class="card h-100 p-3 shadow-sm">

            <h4>
              ${escapeHTML(name)}
            </h4>


            <small
              class="badge badge-secondary align-self-start mb-2">

              ${escapeHTML(category)}

            </small>


            <p class="h5 text-primary mt-auto">

              ${
                price > 0
                  ? "AED " + price
                  : "Price on Request"
              }

            </p>


            <div class="form-group mb-2">

              <label class="small text-muted mb-1">

                Quantity:

              </label>


              <input
                type="number"
                id="qty${index}"
                value="1"
                min="1"
                class="form-control"
              >

            </div>


            <button
              class="btn btn-primary w-100"
              onclick="addToCart(
                ${JSON.stringify(name)},
                ${price},
                document.getElementById('qty${index}').value
              )">

              <i class="fas fa-plus"></i>

              Add to Cart

            </button>

          </div>

        </div>

      `;


      index++;

    });

  })

  .catch(error => {

    console.error(
      "Could not load products:",
      error
    );

  });



/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(
  name,
  price,
  qty
) {

  qty =
    parseInt(qty);


  if (
    isNaN(qty) ||
    qty < 1
  ) {

    return;

  }


  const item =
    cart.find(
      p => p.name === name
    );


  if (item) {

    item.qty += qty;

    item.price +=
      price * qty;

  }

  else {

    cart.push({

      name: name,

      qty: qty,

      price:
        price * qty

    });

  }


  updateCart();

}



/* =====================================================
   REMOVE FROM CART
===================================================== */

function removeFromCart(index) {

  cart.splice(
    index,
    1
  );


  updateCart();

}



/* =====================================================
   UPDATE CART
===================================================== */

function updateCart() {

  const list =
    document.getElementById(
      "cart-items"
    );


  const sendButton =
    document.getElementById(
      "send-order-button"
    );


  const userLocation =
    document
      .getElementById("location")
      .value
      .trim();


  list.innerHTML =
    "";


  total = 0;


  /* EMPTY CART */

  if (
    cart.length === 0
  ) {

    list.innerHTML = `

      <li
        class="list-group-item text-muted text-center py-3">

        Your cart is completely empty

      </li>

    `;


    sendButton.disabled =
      true;


    document
      .getElementById("total")
      .textContent = 0;


    return;

  }


  /* CART HAS ITEMS */

  sendButton.disabled =
    false;


  cart.forEach(
    (item, i) => {

      total +=
        item.price;


      list.innerHTML += `

        <li
          class="list-group-item d-flex justify-content-between align-items-center">

          <div>

            <strong>
              ${escapeHTML(item.name)}
            </strong>


            <span
              class="badge badge-pill badge-primary ml-2">

              x${item.qty}

            </span>


            <div class="small text-muted">

              AED
              ${item.price.toFixed(2)}

            </div>

          </div>


          <button
            class="btn btn-danger btn-sm"
            onclick="removeFromCart(${i})">

            <i class="fas fa-trash"></i>

            Remove

          </button>

        </li>

      `;

    }
  );


  document
    .getElementById("total")
    .textContent =
      total.toFixed(2);

}



/* =====================================================
   SEND ORDER
===================================================== */

async function sendOrder() {

  const button =
    document.getElementById(
      "send-order-button"
    );


  const message =
    document.getElementById(
      "order-message"
    );


  /* CHECK CART */

  if (
    cart.length === 0
  ) {

    alert(
      "Your cart is empty."
    );

    return;

  }


  /* CUSTOMER */

  const customerName =
    document
      .getElementById(
        "customer-name"
      )
      .value
      .trim();


  const customerPhone =
    document
      .getElementById(
        "customer-phone"
      )
      .value
      .trim();


  const customerEmail =
    document
      .getElementById(
        "customer-email"
      )
      .value
      .trim();


  const location =
    document
      .getElementById(
        "location"
      )
      .value
      .trim();



  /* REQUIRED */

  if (!customerName) {

    alert(
      "Please enter your name."
    );

    return;

  }


  if (!customerPhone) {

    alert(
      "Please enter your phone number."
    );

    return;

  }


  if (!location) {

    alert(
      "Please enter your delivery location."
    );

    return;

  }



  /* CREATE ORDER */

  const order = {

    orderId:
      "RV-" +
      Date.now(),


    customerName:
      customerName,


    customerPhone:
      customerPhone,


    customerEmail:
      customerEmail,


    deliveryLocation:
      location,


    items:
      cart.map(item => ({

        name:
          item.name,


        quantity:
          item.qty,


        unitPrice:
          item.qty > 0
            ? item.price /
              item.qty
            : 0

      })),


    total:
      Number(
        total.toFixed(2)
      ),


    createdAt:
      new Date()
        .toISOString()

  };



  /* DISABLE BUTTON */

  button.disabled =
    true;


  button.innerHTML =
    '<i class="fas fa-spinner fa-spin"></i> Sending...';


  message.innerHTML =
    "";



  try {


    /*
     SEND TO YOUR SERVER
    */

    const response =
      await fetch(
        ORDER_SERVER_URL,
        {

          method:
            "POST",


          headers: {

            "Content-Type":
              "application/json"

          },


          body:
            JSON.stringify(
              order
            )

        }
      );



    if (
      !response.ok
    ) {

      throw new Error(
        "Server returned " +
        response.status
      );

    }



    /* SUCCESS */

    message.innerHTML = `

      <div class="alert alert-success">

        <strong>
          ✓ Order sent successfully!
        </strong>

        <br>

        Order number:
        ${escapeHTML(order.orderId)}

      </div>

    `;


    /* EMPTY CART */

    cart = [];


    updateCart();


    /* CLEAR CUSTOMER FIELDS */

    document
      .getElementById(
        "customer-name"
      )
      .value = "";


    document
      .getElementById(
        "customer-phone"
      )
      .value = "";


    document
      .getElementById(
        "customer-email"
      )
      .value = "";


    document
      .getElementById(
        "location"
      )
      .value = "";


  }


  catch(error) {


    console.error(
      error
    );


    message.innerHTML = `

      <div class="alert alert-danger">

        <strong>
          ✕ Order could not be sent.
        </strong>

        <br>

        Please try again.

      </div>

    `;


  }


  finally {


    button.disabled =
      false;


    button.innerHTML =
      '<i class="fas fa-paper-plane"></i> Send Order';

  }

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

  return String(
    value || ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   INITIAL CART
===================================================== */

updateCart();

</script>

</body>
</html>
