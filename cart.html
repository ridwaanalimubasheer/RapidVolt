<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Rapid Volt</title>
<link rel="shortcut icon" type="image/png" href="assets/images/rapidvolt.png">

<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css">
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<!-- ================= HEADER ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <a class="navbar-brand font-weight-bold" href="#">Rapid Volt</a>

  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navMain">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navMain">
    <ul class="navbar-nav ml-auto">
      <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Shop</a></li>
      <li class="nav-item"><a class="nav-link" href="#">About Us</a></li>
      <li class="nav-item">
        <a class="nav-link text-success" href="https://wa.me/971555778653" target="_blank">
          <i class="fab fa-whatsapp"></i> WhatsApp
        </a>
      </li>
    </ul>
  </div>
</nav>

<!-- ================= SHOP ================= -->
<section class="container my-5">
  <h2 class="text-center mb-4">Rapid Volt – Cabling Products</h2>

  <div class="row" id="product-list"></div>
  <div class="row mb-4">
  <div class="col-md-6 mx-auto">
    <input
      type="text"
      id="search"
      class="form-control"
      placeholder="Search products..."
      onkeyup="filterProducts()"
    >
  </div>
</div>


  <hr>

  <h4>Cart</h4>
  <ul id="cart-items"></ul>
  <p><strong>Total: AED <span id="total">0</span></strong></p>

  <a id="whatsapp-link" class="btn btn-success" target="_blank">
    Order via WhatsApp
  </a>
</section>

<footer class="bg-dark text-white text-center p-3">
  © 2026 Rapid Volt
</footer>

<script src="assets/js/jquery-1.12.0.min.js"></script>
<script src="assets/js/bootstrap.min.js"></script>

<script>
let cart = [];
let total = 0;
fetch("products.txt")
  .then(res => res.text())
  .then(text => {
    const lines = text.split("\n");
    const container = document.getElementById("product-list");

    let category = "";
    let index = 0;

    lines.forEach(line => {
      line = line.trim();
      if (!line) return;

      // CATEGORY
      if (line.startsWith("#")) {
        category = line.replace("#", "");
        container.innerHTML += `
          <div class="col-12">
            <h3 class="mt-4 mb-3">${category}</h3>
          </div>
        `;
        return;
      }

      // PRODUCT
      const parts = line.split("|");
      const name = parts[0].trim();
      const price = parseFloat(parts[1].trim());

      container.innerHTML += `
        <div class="col-md-4 mb-3 product-card">
          <div class="card p-3">
            <h4>${name}</h4>
            <small class="text-muted">${category}</small>
            <p class="mt-2">AED ${price}</p>
            <input type="number" id="qty${index}" value="1" min="1" class="form-control mb-2">
            <button class="btn btn-primary w-100"
              onclick="addToCart('${name}', ${price}, document.getElementById('qty${index}').value)">
              Add to Cart
            </button>
          </div>
        </div>
      `;
      index++;
    });
  });


// CART FUNCTIONS
function addToCart(name, price, qty) {
  qty = parseInt(qty);
  const item = cart.find(p => p.name === name);

  if (item) {
    item.qty += qty;
    item.price += price * qty;
  } else {
    cart.push({ name, qty, price: price * qty });
  }
  updateCart();
}

function removeFromCart(index) {
  cart.splice(index, 1);
  updateCart();
}

function updateCart() {
  const list = document.getElementById("cart-items");
  list.innerHTML = "";
  total = 0;

  cart.forEach((item, i) => {
    total += item.price;
    list.innerHTML += `
      <li>
        ${item.name} x${item.qty} – AED ${item.price}
        <button onclick="removeFromCart(${i})">Remove</button>
      </li>
    `;
  });

  document.getElementById("total").textContent = total;

  let msg = "Hello, I want to order:%0A";
  cart.forEach(i => msg += `- ${i.name} x${i.qty} (AED ${i.price})%0A`);
  msg += `Total: AED ${total}`;

  document.getElementById("whatsapp-link").href =
    "https://wa.me/971555778653?text=" + msg;
}
  function filterProducts() {
  const search = document.getElementById("search").value.toLowerCase();
  const cards = document.querySelectorAll("#product-list .card");

  cards.forEach(card => {
    const name = card.querySelector("h4").textContent.toLowerCase();
    card.parentElement.style.display =
      name.includes(search) ? "block" : "none";
  });
}

</script>

</body>
</html>
